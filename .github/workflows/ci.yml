name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    uses: ./.github/workflows/affected.yml

  checks:
    needs: affected
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.affected.outputs.base }}
      NX_HEAD: ${{ needs.affected.outputs.head }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        if: needs.affected.outputs.api == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Terraform
        if: needs.affected.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install Node dependencies
        run: npm ci

      - name: Check formatting
        run: npm exec -- nx format:check

      - name: Build, lint, and test affected projects
        if: needs.affected.outputs.any == 'true'
        run: npm exec -- nx affected --targets=build,lint,test,test-arch,fmt-check,validate

  # Read-only Terraform plan for the dev environment so infra changes are reviewable in the PR.
  # Runs only when `infra` changed and the GitHub variables from `nx run infra:output` exist.
  terraform-plan:
    needs: affected
    if: github.event_name == 'pull_request' && needs.affected.outputs.infra == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      NX_BASE: ${{ needs.affected.outputs.base }}
      NX_HEAD: ${{ needs.affected.outputs.head }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_domain: ${{ vars.APP_DOMAIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Install Node dependencies
        run: npm ci

      - name: Load Aura management credentials
        id: aura
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            client_id:${{ vars.GCP_PROJECT_ID }}/AURA_CLIENT_ID
            client_secret:${{ vars.GCP_PROJECT_ID }}/AURA_CLIENT_SECRET

      - name: Terraform plan (dev)
        env:
          AURA_CLIENT_ID: ${{ steps.aura.outputs.client_id }}
          AURA_CLIENT_SECRET: ${{ steps.aura.outputs.client_secret }}
        run: npm exec -- nx run infra:plan --configuration=dev

name: Deploy

# Provisions infrastructure (Terraform, `infra` project) and deploys the apps
# (api, web and ai -> Cloud Run) for every push to main. Only projects that changed since the
# last successful Deploy run are touched; use "Run workflow" with all=true to force everything.
#
# Required GitHub repository *variables* (Settings > Secrets and variables > Actions > Variables).
# Their values are printed by `nx run infra:output` under `github_actions` after the first apply:
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SERVICE_ACCOUNT, APP_DOMAIN (optional)
# No long-lived keys: auth uses Workload Identity Federation (id-token permission below).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      all:
        description: Deploy every project, not only the affected ones
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: dev
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_domain: ${{ vars.APP_DOMAIN }}

jobs:
  affected:
    uses: ./.github/workflows/affected.yml
    with:
      all: ${{ inputs.all || false }}

  # 1. Infrastructure first, so the Cloud Run services exist before images are pushed.
  infra:
    needs: affected
    if: needs.affected.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Install Node dependencies
        run: npm ci

      - name: Terraform apply (dev)
        run: npm exec -- nx run infra:apply --configuration=dev

  # 2. Then only the apps whose code (or deploy scripts, or dependencies) changed.
  apps:
    needs: [affected, infra]
    # `always()` keeps this job eligible when `infra` was skipped; it still bails if infra failed.
    if: always() && needs.affected.result == 'success' && needs.infra.result != 'failure' && needs.infra.result != 'cancelled' && (needs.affected.outputs.api == 'true' || needs.affected.outputs.web == 'true' || needs.affected.outputs.ai == 'true')
    runs-on: ubuntu-latest
    environment: dev
    env:
      NX_BASE: ${{ needs.affected.outputs.base }}
      NX_HEAD: ${{ needs.affected.outputs.head }}
      NX_COMMAND: ${{ inputs.all && 'run-many' || 'affected' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Images are built inside Docker (multi-stage), so no Java/Gradle on the runner. The
      # docker-container builder lets tools/deploy/common.sh cache layers in Artifact Registry.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Install Node dependencies
        run: npm ci

      - name: Deploy affected apps
        run: npm exec -- nx "${NX_COMMAND}" --target=deploy --exclude=infra

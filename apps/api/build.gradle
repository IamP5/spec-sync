plugins {
    id "dev.nx.gradle.project-graph" version "0.1.25"
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.1'
}

group = 'com.fiap'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.1")
	set('springCloudGcpVersion', "8.0.5")
	set('springCloudVersion', "2025.1.3")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.google.cloud:spring-cloud-gcp-starter'
	implementation 'com.google.cloud:spring-cloud-gcp-starter-pubsub'
	implementation 'com.google.cloud:spring-cloud-gcp-starter-storage'
	implementation 'com.google.cloud:spring-cloud-gcp-starter-sql-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.cloud:spring-cloud-stream'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	developmentOnly 'org.springframework.ai:spring-ai-spring-boot-docker-compose'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "com.google.cloud:spring-cloud-gcp-dependencies:${springCloudGcpVersion}"
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// Architecture rules only (src/test/java/.../architecture, tagged with ArchUnit's
// @ArchTag("architecture")). Fast enough to run after every agent coding round and
// before every commit; `test` still runs them together with everything else.
tasks.register('archTest', Test) {
	description = 'Runs the ArchUnit architecture rules only.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'architecture'
	}
	// A tag mismatch would make the hooks pass on an empty run; fail loudly instead.
	afterSuite { descriptor, result ->
		if (descriptor.parent == null) {
			println "archTest: ${result.testCount} rules checked, ${result.failedTestCount} failed"
			if (result.testCount == 0) {
				throw new GradleException('archTest executed no tests: check the @ArchTag("architecture") filter')
			}
		}
	}
}

// Formatting is a check, not a style debate: `spotlessCheck` fails the hooks,
// `spotlessApply` fixes the files.
spotless {
	java {
		target 'src/**/*.java'
		palantirJavaFormat('2.97.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// Only the boot jar is needed; skipping the plain jar keeps build/libs unambiguous for the Dockerfile.
tasks.named('jar') {
	enabled = false
}

allprojects {
    apply {
        plugin("dev.nx.gradle.project-graph")
    }
}

# Only active during the Docker build's AOT-cache training run (see apps/api/Dockerfile).
# It lets the Spring context refresh with no database or Google Cloud reachable.
spring.cloud.gcp.core.enabled=false
spring.cloud.gcp.project-id=aot-training
spring.cloud.gcp.pubsub.enabled=false
spring.cloud.gcp.storage.enabled=false
spring.cloud.gcp.sql.enabled=false
spring.datasource.url=jdbc:postgresql://localhost:1/aot
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.flyway.enabled=false

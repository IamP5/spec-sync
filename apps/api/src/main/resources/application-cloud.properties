# Active on Cloud Run (SPRING_PROFILES_ACTIVE=cloud, set by infra/environments/dev/main.tf).
server.port=${PORT:8080}
spring.docker.compose.enabled=false

# Cloud SQL via the Cloud SQL Auth connector (spring-cloud-gcp-starter-sql-postgresql).
# Instance connection name, database, username and password arrive as env vars.
spring.cloud.gcp.sql.enabled=true
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Authenticate the API workload when invoking the private AI service.
specsync.cloud-run.enabled=true

# AI credits: the shared key the AI service presents on /api/internal/ai-credits/** (same variable
# as the local default; named here because Terraform sets it on the Cloud Run service).
specsync.credits.service-key=${SPECSYNC_CREDITS_SERVICE_KEY:}

# One JSON object per log line; Cloud Logging reads "severity" and indexes the event key-values
# (security.audit: authentication failures, access denials, rate limiting, critical changes).
logging.structured.format.console=logstash
logging.structured.json.rename.level=severity

spring.application.name=api
# Optional developer-only properties; environment variables take precedence.
spring.config.import=optional:file:./.env.local[.properties]
spring.docker.compose.file=../../compose.yaml
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}

# Cloud SQL connector is enabled only by the "cloud" profile (see application-cloud.properties)
spring.cloud.gcp.sql.enabled=false

# Flyway owns the schema; Hibernate must never create or update it.
spring.jpa.hibernate.ddl-auto=validate

# Ingestion is opt-in; keys are supplied through the environment, never checked in.
specsync.ingestion.enabled=${SPECSYNC_INGESTION_ENABLED:false}
specsync.ingestion.reviewer-key=${SPECSYNC_INGESTION_REVIEWER_KEY:}
specsync.ingestion.worker-key=${SPECSYNC_INGESTION_WORKER_KEY:}
specsync.ingestion.worker-url=${SPECSYNC_INGESTION_WORKER_URL:http://127.0.0.1:4111}

# AI credits are enabled exactly when this shared key is set (>= 32 characters); the AI service
# presents it as a bearer token on /api/internal/ai-credits/**.
specsync.credits.service-key=${SPECSYNC_CREDITS_SERVICE_KEY:}

# The AI service verifies the user's identity before calling the private research API.
specsync.research.service-key=${SPECSYNC_RESEARCH_SERVICE_KEY:}
specsync.research.policy-version=${SPECSYNC_RESEARCH_POLICY_VERSION:br-v1}

# Firebase project whose ID tokens (forwarded by the gateway in X-SpecSync-Token) the API verifies
# for RBAC on the curation endpoints. Blank keeps the shared curator key (X-Ingestion-Key).
specsync.security.jwt.project-id=${SPECSYNC_JWT_PROJECT_ID:}
# Per-instance budget per caller on /api/** (internal machine endpoints are exempt).
specsync.rate-limit.requests-per-minute=${SPECSYNC_RATE_LIMIT_PER_MINUTE:300}
# AES-256 data key (Base64 of 32 bytes) for personal columns such as the research contact link.
# Blank stores new values in plain text; the cloud value comes from Secret Manager.
specsync.field-encryption.key=${SPECSYNC_FIELD_ENCRYPTION_KEY:}

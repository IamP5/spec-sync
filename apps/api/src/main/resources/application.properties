spring.application.name=api
spring.docker.compose.file=../../compose.yaml
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}

# Cloud SQL connector is enabled only by the "cloud" profile (see application-cloud.properties)
spring.cloud.gcp.sql.enabled=false

# Flyway owns the schema; Hibernate must never create or update it.
spring.jpa.hibernate.ddl-auto=validate

# Optional read-only graph retrieval. URL is the Neo4j HTTP origin, without /browser.
specsync.knowledge.url=${NEO4J_HTTP_URL:}
specsync.knowledge.username=${NEO4J_USERNAME:neo4j}
specsync.knowledge.password=${NEO4J_PASSWORD:}

specsync.knowledge.embedding-model=${SPECSYNC_REVIEW_EMBEDDING_MODEL:}

# Unit and context tests must not require external model credentials.
spring.ai.model.chat=none
# This file shadows the main application.properties on the test classpath, so the Cloud SQL
# connector (enabled only by the "cloud" profile) must be switched off here as well.
spring.cloud.gcp.sql.enabled=false
# CI runners have no gcloud config or credentials: keep the Google Cloud clients out of the
# test context entirely (same switches as the AOT training profile, application-aot.properties).
spring.cloud.gcp.core.enabled=false
spring.cloud.gcp.project-id=test-project
spring.cloud.gcp.pubsub.enabled=false
spring.cloud.gcp.storage.enabled=false
# PostgreSQL-specific migrations are exercised by api:data-integration against real databases.
# Existing unit/context tests use H2 and do not exercise the catalog persistence layer.
spring.flyway.enabled=false

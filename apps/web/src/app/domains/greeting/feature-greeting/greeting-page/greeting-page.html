<section
  class="relative z-10 mx-auto my-5 mb-16 w-[min(720px,calc(100%-40px))] self-center text-center"
  aria-labelledby="page-title"
>
  <z-badge
    zType="outline"
    class="mb-6 gap-2 bg-background/80 px-3 py-1.5 font-mono text-[10px] tracking-[0.08em] text-muted-foreground uppercase"
  >
    <span>Java 25</span>
    <span
      class="size-0.75 rounded-full bg-muted-foreground/60"
      aria-hidden="true"
    ></span>
    <span>Angular</span>
    <span
      class="size-0.75 rounded-full bg-muted-foreground/60"
      aria-hidden="true"
    ></span>
    <span>Nx</span>
  </z-badge>

  <h1
    id="page-title"
    class="text-[clamp(3.4rem,9vw,6.5rem)] leading-[0.9] font-semibold tracking-[-0.075em] text-foreground"
  >
    Your workspace,<br />
    <span
      class="bg-linear-to-b from-ford-action to-ford-heritage bg-clip-text text-transparent dark:from-sky-200 dark:to-ford-action"
    >
      connected.
    </span>
  </h1>

  <p
    class="mx-auto mt-7 mb-9 max-w-[540px] text-base leading-relaxed text-muted-foreground max-sm:text-sm"
  >
    Send a name from the web application and receive a live response from the
    Spring Boot API.
  </p>

  <form
    class="mx-auto w-[min(600px,100%)] text-left"
    (submit)="onSubmit($event)"
    novalidate
  >
    <label
      for="name"
      class="mb-2 block text-xs font-medium text-muted-foreground"
    >
      What should we call you?
    </label>
    <div
      class="grid grid-cols-[1fr_auto] gap-2 rounded-xl border bg-card p-1.5 shadow-lg shadow-black/5 transition-colors focus-within:border-ring max-sm:grid-cols-1 dark:shadow-black/40"
    >
      <input
        z-input
        id="name"
        type="text"
        autocomplete="name"
        placeholder="Enter your name"
        class="h-11 border-0 bg-transparent px-3 focus-visible:ring-0 dark:bg-transparent"
        [formField]="greetingForm.name"
      />
      <button
        z-button
        type="submit"
        class="h-11 min-w-31 px-4 text-[13px] font-semibold"
        [zLoading]="loading()"
      >
        @if (loading()) { Connecting } @else { Say hello
        <ng-icon name="lucideArrowRight" aria-hidden="true" />
        }
      </button>
    </div>
  </form>

  <div class="mx-auto mt-6 min-h-41 w-[min(600px,100%)]" aria-live="polite">
    @if (greeting(); as response) {
    <z-card
      class="animate-in fade-in slide-in-from-bottom-2 gap-0 py-0 text-left duration-300"
    >
      <z-card-header
        class="grid-cols-[1fr_auto_1fr] items-center border-b px-3.5 py-2.5 font-mono text-[10px] text-muted-foreground"
      >
        <div class="flex gap-1.5" aria-hidden="true">
          <i class="size-1.5 rounded-full bg-muted-foreground/40"></i>
          <i class="size-1.5 rounded-full bg-muted-foreground/40"></i>
          <i class="size-1.5 rounded-full bg-muted-foreground/40"></i>
        </div>
        <span>api.response</span>
        <z-badge
          zType="outline"
          class="justify-self-end gap-1 border-success/30 text-success"
        >
          <ng-icon name="lucideCircleCheck" aria-hidden="true" />
          200 OK
        </z-badge>
      </z-card-header>
      <z-card-content class="p-6">
        <p class="mb-5 text-xl font-medium tracking-tight text-foreground">
          {{ response.message }}
        </p>
        <div
          class="flex items-center justify-between gap-4 border-t pt-4 text-[11px] text-muted-foreground uppercase"
        >
          <span>request hash</span>
          <code
            class="font-mono text-[11px] tracking-[0.08em] text-foreground/70"
          >
            {{ response.hash }}
          </code>
        </div>
      </z-card-content>
    </z-card>
    } @if (error()) {
    <z-alert
      zType="destructive"
      zRole="alert"
      [zDescription]="error()"
      class="animate-in fade-in slide-in-from-bottom-1 duration-200"
    />
    }
  </div>
</section>

<z-sidebar-footer class="mt-auto border-t border-sidebar-border p-2">
  <ul z-sidebar-menu>
    <li z-sidebar-menu-item>
      <button
        z-sidebar-menu-button
        type="button"
        zSize="lg"
        z-dropdown
        [zDropdownMenu]="userMenu"
        class="min-h-12 data-[state=open]:bg-sidebar-accent"
        data-action="user-menu"
        aria-label="Account menu"
        zTooltip="Settings and appearance"
      >
        <z-avatar
          class="shrink-0 rounded-full text-xs font-semibold text-sidebar-foreground"
          [zFallback]="initials()"
          [zSrc]="user()?.photoUrl ?? ''"
          [zAlt]="user()?.displayName || 'User'"
        />
        <span
          class="sidebar-expanded grid min-w-0 flex-1 text-left leading-tight whitespace-nowrap"
        >
          <span class="truncate text-sm font-medium"
            >{{ user()?.displayName || 'User' }}</span
          >
          <span class="truncate text-xs text-muted-foreground"
            >{{ user()?.email }}</span
          >
        </span>
        <ng-icon
          name="lucideChevronsUpDown"
          class="sidebar-expanded ml-auto text-muted-foreground"
          aria-hidden="true"
        />
      </button>
      <z-dropdown-menu-content
        #userMenu
        zSide="top"
        zAlign="start"
        [zSideOffset]="8"
        class="flex w-64 max-w-[calc(100vw-1rem)] flex-col rounded-xl"
      >
        <z-dropdown-menu-label class="flex items-center gap-2 font-normal">
          <z-avatar
            zSize="sm"
            class="rounded-full"
            [zFallback]="initials()"
            [zSrc]="user()?.photoUrl ?? ''"
            [zAlt]="user()?.displayName || 'User'"
          />
          <span class="grid min-w-0 leading-tight">
            <span class="truncate text-sm font-medium"
              >{{ user()?.displayName || 'User' }}</span
            >
            <span class="truncate text-xs text-muted-foreground"
              >{{ user()?.email }}</span
            >
          </span>
        </z-dropdown-menu-label>
        <z-dropdown-menu-separator />
        <button
          z-dropdown-menu-sub-trigger
          type="button"
          class="min-h-9 w-full rounded-md px-3"
          [zSubMenu]="appearanceMenu"
        >
          <ng-icon name="lucideMonitor" aria-hidden="true" />
          Appearance
        </button>
        <z-dropdown-menu-sub-content
          #appearanceMenu
          class="flex w-48 flex-col rounded-xl p-1.5"
        >
          <button
            z-dropdown-menu-item
            class="min-h-9 w-full rounded-md px-3"
            type="button"
            role="menuitemradio"
            [attr.aria-checked]="theme() === themes.LIGHT"
            (click)="onTheme(themes.LIGHT)"
          >
            <ng-icon name="lucideSun" aria-hidden="true" />
            Light @if (theme() === themes.LIGHT) {
            <z-dropdown-menu-shortcut aria-hidden="true"
              >✓</z-dropdown-menu-shortcut
            >
            }
          </button>
          <button
            z-dropdown-menu-item
            class="min-h-9 w-full rounded-md px-3"
            type="button"
            role="menuitemradio"
            [attr.aria-checked]="theme() === themes.DARK"
            (click)="onTheme(themes.DARK)"
          >
            <ng-icon name="lucideMoon" aria-hidden="true" />
            Dark @if (theme() === themes.DARK) {
            <z-dropdown-menu-shortcut aria-hidden="true"
              >✓</z-dropdown-menu-shortcut
            >
            }
          </button>
          <button
            z-dropdown-menu-item
            class="min-h-9 w-full rounded-md px-3"
            type="button"
            role="menuitemradio"
            [attr.aria-checked]="theme() === themes.SYSTEM"
            (click)="onTheme(themes.SYSTEM)"
          >
            <ng-icon name="lucideMonitor" aria-hidden="true" />
            System @if (theme() === themes.SYSTEM) {
            <z-dropdown-menu-shortcut aria-hidden="true"
              >✓</z-dropdown-menu-shortcut
            >
            }
          </button>
        </z-dropdown-menu-sub-content>
        <z-dropdown-menu-separator />
        <button
          z-dropdown-menu-item
          class="min-h-9 w-full rounded-md px-3"
          type="button"
          data-action="settings"
          (click)="settings.emit()"
        >
          <ng-icon name="lucideSettings" aria-hidden="true" />
          Settings
        </button>
        <z-dropdown-menu-separator />
        <app-auth-logout-overview />
        @if (preferences.error()) {
        <p role="alert" class="px-3 text-sm text-destructive">
          The change could not be completed. Please try again.
        </p>
        }
      </z-dropdown-menu-content>
    </li>
  </ul>
</z-sidebar-footer>

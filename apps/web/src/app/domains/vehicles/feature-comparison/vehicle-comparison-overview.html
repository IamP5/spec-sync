<app-vehicle-comparison-card
  [result]="comparison()"
  [images]="images()"
  [failure]="failure()"
  [complete]="complete()"
  [questionsEnabled]="questionsEnabled()"
  [queryField]="filterForm.query"
  [differencesOnly]="differencesOnly()"
  [rows]="rows()"
  (differencesChanged)="differencesOnly.set($event)"
  (filtersCleared)="reset()"
  (reviewsRequested)="openReviews($event)"
  (followUpRequested)="followUp()"
/>
<z-drawer
  [(zVisible)]="reviewsOpen"
  [zPlacement]="mobileScreen().matches ? 'bottom' : 'right'"
  [zHandle]="mobileScreen().matches"
  (zAfterClose)="afterReviewsClosed()"
  class="specsync-vehicle-drawer overflow-hidden md:w-[min(44rem,calc(100vw-3rem))]!"
>
  <z-drawer-title class="sr-only" i18n
    >Reviews about {{ reviewContext()?.row?.attribute?.label }}</z-drawer-title
  >
  @if (reviewContext(); as context) {
  <app-vehicle-reviews-search
    [context]="context"
    (closed)="closeReviews()"
    (questionRequested)="finishReview($event)"
  />
  }
</z-drawer>

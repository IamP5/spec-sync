<app-vehicle-reviews-pane
  [context]="context()"
  [filterForm]="filterForm"
  [loading]="store.reviewsIsLoading()"
  [failed]="!!store.reviewsError()"
  [limited]="!!store.reviewsValue()?.limited"
  [failedNames]="failedNames()"
  [items]="items()"
  [visible]="visible()"
  [selected]="selected()"
  [selectedReviews]="selectedReviews()"
  [media]="media()"
  (closed)="closed.emit()"
  (retried)="store.retry()"
  (selectionToggled)="toggle($event)"
  (filtersCleared)="reset()"
  (askRequested)="ask()"
  (discoverRequested)="discover()"
/>

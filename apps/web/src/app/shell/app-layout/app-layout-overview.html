<z-sidebar-provider
  class="chat-shell h-full min-h-0"
  style="--sidebar-width: 17rem; --sidebar-width-icon: 3.5rem"
  [zOpen]="open()"
  [class.sidebar-preview]="preview() && !pinned()"
  (zOpenChange)="togglePinned()"
>
  <z-sidebar
    #sidebar
    zCollapsible="icon"
    role="navigation"
    i18n-aria-label
    aria-label="Conversations"
    (pointerenter)="onPreview($event)"
  >
    <app-sidebar-overview (navigated)="preview.set(false)" />
  </z-sidebar>
  <main z-sidebar-inset class="h-full min-h-0 min-w-0 overflow-hidden">
    <router-outlet />
  </main>
</z-sidebar-provider>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>SpecSync Assistant</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="The SpecSync assistant: write and review software specifications in a conversation."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        const html = document.documentElement;

        // The language the user picked, so assistive technology and font
        // rendering are right before the bundle runs. `main.ts` resolves the
        // same value (falling back to the browser's languages) and re-applies
        // it; keep the storage key in sync with `LOCALE_STORAGE_KEY`.
        try {
          const locale = localStorage.getItem('specsync.locale');
          if (['pt-BR', 'en-US', 'es-419'].includes(locale))
            html.setAttribute('lang', locale);
        } catch (_) {}

        let theme = 'system';
        try {
          const stored = localStorage.getItem('theme');
          if (['light', 'dark', 'system'].includes(stored)) theme = stored;
        } catch (_) {}
        const prefersDark =
          window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        const scheme = isDark ? 'dark' : 'light';
        html.classList.toggle('dark', isDark);
        html.setAttribute('data-theme', theme);
        html.style.colorScheme = scheme;
        document.querySelector('meta[name="color-scheme"]').content = scheme;
        document.querySelector('meta[name="theme-color"]').content = isDark
          ? '#0f0f0f'
          : '#ffffff';
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
